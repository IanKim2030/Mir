# 함대 설정 — 제어부가 읽는 **기대 인벤토리**.
#
# 오케스트레이터가 없으므로 "어디에 무엇이 있어야 하는가"를 알려 주는 주체가
# 없다. 그 자리를 이 파일이 대신한다. 그리고 이 구조는 노드 allocatable 을
# 합산하던 방식보다 오히려 정확하다 — 기대(이 파일)와 실측(HelloResponse)을
# 따로 들고 대조할 수 있어서, 아래 셋이 구분된다.
#
#   unreachable  기대는 있는데 연결이 안 된다 (컨테이너 다운 / 방화벽)
#   no-ports     떠 있는데 NIC 을 하나도 못 잡았다 (vfio 바인딩 실패)
#   pf-mismatch  떴는데 설정과 다른 PF 를 잡았다 (BDF 오설정)
#
# 상태는 GET /api/dataplanes, 장비 단위 롤업은 GET /api/capacity.
#
# ★ 이름 규약: 인스턴스 이름은 "<machine.name>-dp<instance.id>" 로 만들어진다.
#   compose 의 MIR_MACHINE 과 여기 name 이 같아야 하고, 그래야 컨테이너가
#   보고하는 node_id 와 이 설정이 이어진다.

machines:
  - name: gen-1
    address: 10.10.40.121
    instances:
      - { id: 0, port: 9100, pf: "0000:43:00.0" }
      - { id: 1, port: 9101, pf: "0000:43:00.1" }
      - { id: 2, port: 9102, pf: "0000:43:00.2" }
      - { id: 3, port: 9103, pf: "0000:43:00.3" }

  # 장비를 늘리는 데 필요한 건 이 블록 하나뿐이다. 데이터플레인은
  # share-nothing 이라 장비 간에 맞출 상태가 없다 — 개별 패킷이 프로세스
  # 경계를 넘지 않으므로 각자 자기 PF 에서 생성하고 판정해 요약만 올린다.
  #
  # 다만 장비 경계를 넘는 순간 **시계 동기(PTP)가 전제**가 된다. 텔레메트리
  # ts_ns 가 CLOCK_REALTIME 이라, 장비 간 시계가 어긋나면 상관 분석과 지연
  # 측정이 무의미해진다. → deploy/host/60-ptp.md
  - name: gen-2
    address: 10.10.40.122
    instances:
      - { id: 0, port: 9100, pf: "0000:43:00.0" }
      - { id: 1, port: 9101, pf: "0000:43:00.1" }
      - { id: 2, port: 9102, pf: "0000:43:00.2" }
      - { id: 3, port: 9103, pf: "0000:43:00.3" }
