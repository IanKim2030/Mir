# 베어메탈 단일 노드 오버레이 — 이번 작업에서 실제로 작성하는 유일한 오버레이.
#
#   kubectl apply -k deploy/k8s/overlays/baremetal
#
# SR-IOV Device Plugin(DaemonSet + ConfigMap)은 여기 포함하지 않는다.
# 클러스터 인프라이지 Mir 애플리케이션의 일부가 아니고, 무엇보다 아래
# `namespace: mir` 변환이 kube-system 에 있어야 할 ConfigMap 까지 끌고 오기
# 때문이다. 별도로 적용한다 — README.md 참조.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mir

resources:
  - ../../base

patches:
  - path: dataplane-resources.yaml
    target:
      kind: Deployment
      name: mir-dataplane

# ★ 이 값이 N 이다 — 아키텍처상 고정값이 아니라 **장비별 변수**다.
#   PF 하나당 파드 하나이므로, NIC 을 늘리면 여기만 올리면 되고 코드는 그대로다.
#   대신 코어·hugepage·PCIe 슬롯이 함께 N 배로 커진다 (REQUIREMENTS 3절 성능).
#
# NIC PF 개수와 같아야 한다. 넘으면 초과분이 Pending 에 쌓인다
# (제어부 API 로 조정하면 상한 검증이 걸려 400 으로 거절된다).
#
# 검증기 10.10.40.121 = X710 4포트 → 4.
#   코어      4 파드 × cpu "5" = 20   ≤ isolcpus 2-23 (22코어)
#   hugepage  4 파드 × 4Gi     = 16Gi = hugepages=16
# 두 값 모두 딱 맞으므로 replicas 를 올리려면 10-kernel-cmdline.md 부터 고쳐야 한다.
#
# ⚠️ 실물 첫 기동(Phase 0 검증)에서는 1 로 낮춰 단일 파드부터 확인할 것.
replicas:
  - name: mir-dataplane
    count: 4

images:
  - name: mir/dataplane
    newTag: dev
  - name: mir/agent
    newTag: dev
  - name: mir/control
    newTag: dev
