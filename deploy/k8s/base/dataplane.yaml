# 데이터플레인 — 컨테이너 2개(C/DPDK + Go 사이드카)를 한 파드에 둔다.
#
# 리소스·securityContext·hugepage 크기는 **여기 박지 않는다**. 환경마다 달라지는
# 네 가지(hugepage 크기 · securityContext · device plugin 리소스명 · replicas)만
# 오버레이 경계로 유지하면, base 를 손대지 않고 환경을 늘릴 수 있다.
# → deploy/k8s/overlays/baremetal/ 참조. base 를 단독으로 apply 하면
#   BestEffort QoS 로 떠서 배타 코어도 NIC 도 받지 못한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mir-dataplane
  labels:
    app: mir-dataplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mir-dataplane

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # ★ 반드시 0.
      # NIC PF 는 배타 자원이라 기본값(25%)이면 새 파드를 먼저 띄우려다
      # 남는 PF 가 없어 영원히 Pending 에 머문다. 배타 CPU 도 같은 문제를 겪는다.
      # 먼저 죽여야 PF 가 반납된다.
      maxSurge: 0
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: mir-dataplane
    spec:
      # 사이드카는 nonroot(65532)로 돌고 데이터플레인은 root 다. 둘이 emptyDir
      # 하나를 공유하므로, fsGroup 으로 그룹 쓰기 권한을 맞춰 준다.
      securityContext:
        fsGroup: 65532

      # DPDK 정리(rte_eal_cleanup)와 hugepage 반납에 시간을 준다.
      terminationGracePeriodSeconds: 30

      containers:
        # ── C/DPDK — 배타 코어를 받는 쪽 ──────────────────────
        - name: dataplane
          image: mir/dataplane:dev
          imagePullPolicy: IfNotPresent

          env:
            # k8s 가 HOSTNAME 을 항상 주입한다고 보장하지 않는다.
            # EAL --file-prefix 와 텔레메트리의 node_id 가 이 값을 쓴다.
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MIR_IPC_SOCKET
              value: /var/run/mir/dp.sock

          volumeMounts:
            - name: hugepage
              mountPath: /dev/hugepages
            - name: ipc
              mountPath: /var/run/mir
            - name: pcap
              mountPath: /var/lib/mir/pcap
              readOnly: true

        # ── Go 사이드카 — 공유 풀에서 도는 쪽 ─────────────────
        - name: agent
          image: mir/agent:dev
          imagePullPolicy: IfNotPresent

          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MIR_IPC_SOCKET
              value: /var/run/mir/dp.sock
            - name: MIR_GRPC_LISTEN
              value: ":9100"

          ports:
            - name: grpc
              containerPort: 9100

          # readiness 만 건다.
          #
          # 사이드카의 health 는 "C 데이터플레인이 붙었는가"를 그대로 반영하므로
          # **readiness 신호이지 liveness 신호가 아니다**. liveness 로 걸면
          # EAL 초기화(수 초)를 기다리는 동안 kubelet 이 사이드카를 죽여
          # 재시작 루프에 빠진다.
          readinessProbe:
            grpc:
              port: 9100
              service: mir.v1.DataPlane
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: ipc
              mountPath: /var/run/mir

      volumes:
        # 크기 한정자(HugePages-1Gi 등)는 오버레이가 붙인다.
        - name: hugepage
          emptyDir:
            medium: HugePages

        # 두 컨테이너가 공유한다 — 여기에 dp.sock 이 생긴다.
        - name: ipc
          emptyDir: {}

        # 리플레이 PCAP. 제어부가 RW 로 쓰고 데이터플레인은 RO 로 읽는다.
        # 파일 내용은 제어 채널을 타지 않는다 — 경로 문자열만 명령으로 전달된다.
        - name: pcap
          persistentVolumeClaim:
            claimName: mir-pcap
