# 환경 무관 부분만 담는다.
#
# ⚠️ base 를 단독으로 apply 하지 말 것. 리소스·securityContext·hugepage 크기가
#    비어 있어 데이터플레인이 BestEffort QoS 로 뜨고, 배타 코어도 NIC 도 받지
#    못한다. 반드시 오버레이를 통해 배포한다:
#
#      kubectl apply -k deploy/k8s/overlays/baremetal
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mir

resources:
  - namespace.yaml
  - control-rbac.yaml
  - pcap-volume.yaml
  - dataplane.yaml
  - dataplane-svc.yaml
  - control.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: mir
