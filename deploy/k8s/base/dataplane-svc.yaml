# headless Service — 제어부가 N개 사이드카를 발견하는 통로.
#
# clusterIP: None 이면 로드밸런싱 없이 **파드 IP 목록**이 EndpointSlice 로
# 노출된다. 제어부는 그 목록을 조회해 각 파드에 개별 gRPC 연결을 유지한다.
# 데이터플레인이 롤링 재생성돼 IP 가 바뀌어도 여기서 자동으로 반영된다.
apiVersion: v1
kind: Service
metadata:
  name: mir-dataplane
  labels:
    app: mir-dataplane
spec:
  clusterIP: None
  selector:
    app: mir-dataplane
  ports:
    - name: grpc
      port: 9100
      targetPort: grpc
      protocol: TCP
