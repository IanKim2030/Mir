# 제어부 권한 — 데이터플레인 개수·리소스를 조정하는 데 필요한 최소한만.
#
# 제어부가 k8s API 를 거치는 이유는 internal/k8s 패키지 주석 참조:
# 개수·리소스 변경은 어떤 경우에도 데이터플레인 재시작을 수반하고,
# 그 재시작 범위를 데이터플레인으로만 한정하려면 제어부가 밖에서 조종해야 한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mir-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mir-control
rules:
  # 개수 조정 — scale 서브리소스만 패치한다. Deployment 본체 전체를
  # 수정할 권한은 주지 않는다.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]

  # 리소스 조정 — pod template 패치 (롤링 재생성을 유발)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]

  # 상태 표시 및 개별 재시작
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]

  # 사이드카 자동 발견
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mir-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mir-control
subjects:
  - kind: ServiceAccount
    name: mir-control
---
# 노드 allocatable 조회는 클러스터 스코프라 ClusterRole 이 필요하다.
# 여기서 읽는 값이 "데이터플레인 개수 상한 = NIC PF 개수" 검증의 근거가 된다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mir-control-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mir-control-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mir-control-nodes
subjects:
  - kind: ServiceAccount
    name: mir-control
    namespace: mir
