# 리플레이 PCAP 용 공유 볼륨.
#
# PCAP 은 GB 단위일 수 있으므로 **제어 채널로 보내지 않는다**. 제어부가 여기에
# 저장하고 경로 문자열만 명령으로 전달하면, 데이터플레인이 직접 열어 읽는다.
# 기존 dataplane/src/pcap_reader.h 의 pcap_reader_open(path) 가 이미 경로
# 기반이라 코드 변경 없이 맞물린다.
#
# 단일 노드 전용 구성이다. hostPath 는 노드에 묶이므로 다중 노드나 클라우드로
# 갈 때는 오버레이에서 적절한 StorageClass 로 교체해야 한다 (Phase 8).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mir-pcap
spec:
  capacity:
    storage: 100Gi
  # 제어부(RW)와 데이터플레인 N개(RO)가 동시에 마운트한다.
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: mir-pcap
  hostPath:
    path: /var/lib/mir/pcap
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mir-pcap
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: mir-pcap
  resources:
    requests:
      storage: 100Gi
  volumeName: mir-pcap
