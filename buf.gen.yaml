# Go 생성물만 여기서 만든다. 저장소 루트에서 `buf generate` 실행.
#
# C 생성물(protobuf-c)은 이미지 빌드 중 meson custom_target 이 protoc-c 로
# 만든다 — 커밋하지 않는다.
#
# 생성물은 control/internal/pb/ 에 떨어지고 커밋한다. Go 관례상 생성 코드를
# 저장소에 두는 편이 빌드가 단순하고, agent 와 control 두 바이너리가
# 같은 패키지를 공유한다.
version: v2
plugins:
  - local: protoc-gen-go
    out: control
    opt: module=mir
  - local: protoc-gen-go-grpc
    out: control
    opt: module=mir
