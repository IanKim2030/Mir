// Mir — 데이터플레인 ⇄ 제어부 공용 스키마.
//
// 이 파일 하나가 **두 hop 을 모두 정의**한다.
//
//   ③ C 데이터플레인 ⇄ Go 사이드카   : unix socket + length-prefix framing
//   ④ Go 사이드카   ⇄ Go 제어부      : gRPC (service DataPlane)
//
// 사이드카는 대부분의 필드를 그대로 통과시키는 릴레이라, 스키마를 하나로
// 유지하면 두 hop 이 갈라질 여지가 없다.
//
// ── hop ③ 와이어 포맷 (C 의 ipc_server.c 와 반드시 일치) ──────────────
//
//   +--------+--------+------------------+
//   | u32 be | u16 be |     payload      |
//   | length |  type  |    (protobuf)    |
//   +--------+--------+------------------+
//
//   length = sizeof(type) + sizeof(payload)   — 자기 자신은 제외
//   type   = MsgType 값
//
// gRPC 를 C 에 직접 넣지 않은 이유는 성능이 아니라 **스레드 격리**다.
// C 프로세스에 gRPC 스레드 풀이 생기면 컨테이너 cpuset(= worker 코어 포함)을
// 떠돌며 busy-poll 루프를 선점할 수 있다. 사이드카는 별도 컨테이너라
// 애초에 worker 코어에 올라갈 물리적 경로가 없다.
//
// ── 코드 생성 ─────────────────────────────────────────────────────────
//
//   Go : buf generate            (저장소 루트에서. 생성물은 커밋한다)
//   C  : protoc-c --proto_path=proto --c_out=<builddir> proto/dataplane.proto
//        (meson custom_target 이 빌드 중에 실행 — 이미지 빌드 시점에만 필요)
//
syntax = "proto3";

package mir.v1;

option go_package = "mir/internal/pb;pb";

// ─────────────────────────────────────────────────────────────
// hop ③ 프레임 타입 태그.
//
// enum 값 자체는 payload 에 실리지 않고 프레임 헤더의 u16 에 들어간다.
// 100 미만 = 제어부 → 데이터플레인, 100 이상 = 데이터플레인 → 제어부.
// ─────────────────────────────────────────────────────────────
enum MsgType {
  MSG_TYPE_UNSPECIFIED = 0;

  // 제어부 → 데이터플레인
  MSG_TYPE_HELLO_REQUEST  = 1;
  MSG_TYPE_START_SCENARIO = 2;
  MSG_TYPE_STOP_SCENARIO  = 3;

  // 데이터플레인 → 제어부
  MSG_TYPE_HELLO_RESPONSE = 101;
  MSG_TYPE_TELEMETRY      = 102;
  MSG_TYPE_EVENT          = 103;
  MSG_TYPE_ACK            = 104;
}

// ─────────────────────────────────────────────────────────────
// 핸드셰이크 — 제어부가 붙자마자 능력을 조회한다.
// ─────────────────────────────────────────────────────────────
message HelloRequest {
  string control_version = 1;
}

message PortInfo {
  uint32 port_id     = 1;
  string driver      = 2;  // "net_i40e", "net_ice", "net_ena" ...
  string mac         = 3;
  int32  numa_node   = 4;
  string device_spec = 5;  // PCI BDF 또는 MAC (환경에 따라 다름 — eal_args.h 참조)
}

message HelloResponse {
  string   dataplane_version = 1;
  string   node_id           = 2;  // 인스턴스명 (HOSTNAME)
  repeated PortInfo ports    = 3;
  repeated uint32   lcores   = 4;  // 실제로 할당받은 CPU 목록 (cpuset 에서 읽은 값)
  uint32   main_lcore        = 5;
}

// ─────────────────────────────────────────────────────────────
// 패킷 명세 (모드 A — Stateless 고속 생성)
//
// 헤더를 구조체로 기술한다. PCAP 리플레이(모드 C)는 원본 바이트를 그대로
// 재생하므로 이 경로를 쓰지 않는다 — 두 모드는 입력이 다르지 자매 관계가 아니다.
//
// **가변 필드.** 같은 패킷만 반복하면 상대의 RSS·플로우 테이블·세션 추적이
// 전부 한 엔트리로 몰려 실제 부하와 동떨어진다. `*_count` 로 값을 N개 순환시켜
// 플로우를 벌린다. 0 또는 1 이면 고정이다.
// ─────────────────────────────────────────────────────────────
message EthSpec {
  string src_mac  = 1;  // 비우면 포트의 실제 MAC 을 쓴다
  string dst_mac  = 2;  // 필수
  uint32 vlan_id  = 3;  // 0 = 태그 없음
  uint32 vlan_pcp = 4;
}

message Ipv4Spec {
  string src = 1;
  string dst = 2;

  // src 부터 N개를 순환한다 (호스트 바이트 순서로 +1). 0/1 = 고정.
  uint32 src_count = 3;
  uint32 dst_count = 4;

  uint32 ttl  = 5;  // 0 = 64
  uint32 dscp = 6;
}

// Phase 2 에서는 **거부한다.** 스키마를 지금 잡아 두는 이유는 나중에 oneof 에
// 끼워 넣으면 두 hop 의 생성 코드를 다시 만들어야 하기 때문이다.
message Ipv6Spec {
  string src        = 1;
  string dst        = 2;
  uint32 src_count  = 3;
  uint32 dst_count  = 4;
  uint32 hop_limit  = 5;
  uint32 traffic_class = 6;
}

message TcpSpec {
  uint32 src_port       = 1;
  uint32 dst_port       = 2;
  uint32 src_port_count = 3;
  uint32 dst_port_count = 4;

  uint32 flags  = 5;  // RTE_TCP_*_FLAG 비트합. 0 = SYN
  uint32 window = 6;  // 0 = 65535
  uint32 seq    = 7;
}

message UdpSpec {
  uint32 src_port       = 1;
  uint32 dst_port       = 2;
  uint32 src_port_count = 3;
  uint32 dst_port_count = 4;
}

message PacketSpec {
  EthSpec eth = 1;

  oneof l3 {
    Ipv4Spec ipv4 = 2;
    Ipv6Spec ipv6 = 3;
  }
  oneof l4 {
    TcpSpec tcp = 4;
    UdpSpec udp = 5;
  }

  // CRC 를 제외한 전체 프레임 길이. 0 이면 헤더 합.
  // 이더넷 최소 프레임 규정 때문에 64 미만은 64 로 올린다 — 그보다 작은
  // 프레임은 선로에 존재할 수 없다.
  uint32 frame_size = 6;

  // 비우면 남는 자리를 패턴으로 채운다. 지정하면 그대로 싣되 frame_size 를 넘지 않는다.
  bytes payload = 7;
}

// ─────────────────────────────────────────────────────────────
// 명령
// ─────────────────────────────────────────────────────────────
message StartScenarioRequest {
  string scenario_id = 1;

  // 리플레이 대상 PCAP. **파일 내용이 아니라 경로만** 전달한다.
  // GB 단위일 수 있으므로 제어 채널로 실어 보내지 않고 공유 볼륨을 경유한다.
  // 제어부가 RW 로, 데이터플레인이 RO 로 같은 볼륨을 마운트한다.
  string pcap_path = 2;

  uint64 rate_pps   = 3;  // 0 = 최대 속도
  uint32 duration_s = 4;  // 0 = 무한

  // 송신 시작 시각 (CLOCK_REALTIME 기준 ns). 0 = 즉시.
  //
  // 장비 여러 대가 **동시에** 송신을 시작해야 하는 시나리오를 위한 것이다.
  // 제어부가 각 인스턴스에 명령을 뿌리는 데는 왕복 지연이 있으므로, "받는 즉시"
  // 로는 장비 간 시작 시점이 수 ms 어긋난다. 공통 시각을 지정해 그 편차를 없앤다.
  //
  // ★ 이 값은 **장비 간 시계가 동기화돼 있을 때만** 의미가 있다. PTP 가
  //   전제이고, 텔레메트리의 ts_ns 도 같은 시계를 쓴다 → deploy/host/60-ptp.md
  //
  uint64 start_at_ns = 5;

  // 모드 A — 생성할 패킷의 명세. pcap_path 와 **배타**다.
  // 둘 다 비면 거부한다(무엇을 보낼지 알 수 없다).
  PacketSpec packet = 6;

  // 송신에 쓸 worker lcore 수. 0 = 가용한 전부.
  //
  // 라인레이트에 필요한 코어 수는 프레임 크기와 NIC 에 따라 크게 달라져서
  // 실측 없이는 정할 수 없다. 이 값을 낮춰 가며 재는 것이 Phase 7 튜닝의
  // 출발점이므로 명령 단위로 조절할 수 있어야 한다.
  uint32 tx_lcores = 7;

  // 모드 B — handshake 제어 (Phase 4). packet 과 **배타**다.
  //
  // Mode A(무상태 블라스트)와 근본적으로 다르다. 상태를 들고 SYN→SYN-ACK→행동
  // 피드백 루프를 돌리므로 라인레이트가 아니라 **세션 수 제한**이다.
  HandshakeSpec handshake = 8;

  // 모드 C — PCAP 리플레이 (Phase 4-1). pcap_path 와 함께 쓴다.
  // pcap_path 가 설정돼 있으면 packet/handshake 는 무시된다.
  ReplayOpts replay = 9;
}

// ─────────────────────────────────────────────────────────────
// 모드 C — PCAP 리플레이 옵션 (Phase 4-1)
//
// pcap_path 가 가리키는 파일(공유 볼륨)을 그대로 선로에 재생한다. 파일 내용은
// 제어 채널을 타지 않는다 — 경로만 명령으로 전달된다(StartScenarioRequest 주석).
// Ethernet 링크타입 프레임만 재생하고, 그 외는 건너뛴다.
// ─────────────────────────────────────────────────────────────
message ReplayOpts {
  // 원본 패킷 간 간격을 유지한다. false 면 NIC 이 받는 대로 최대 속도.
  bool preserve_timing = 1;

  // preserve_timing 일 때 배속. 0 또는 1 = 원속, 2 = 두 배 빠르게. SPB 처럼
  // 타임스탬프가 없는 레코드가 섞이면 그 구간은 최대 속도로 나간다.
  double speed = 2;

  // 반복 횟수. 0 = 1회.
  uint32 loop = 3;

  // 구간 재전송 (0-based). first_pkt 부터 last_pkt 까지.
  // last_pkt = 0 이면 끝까지. 큰 캡처를 나눠 보낼 때 쓴다.
  uint32 first_pkt = 4;
  uint32 last_pkt  = 5;
}

// ─────────────────────────────────────────────────────────────
// 모드 B — handshake 제어 명세 (Phase 4)
//
// N개의 TCP 3-way handshake 를 시도하고, SYN-ACK 를 받은 뒤 지정한 행동을
// 한다. **비정상 handshake 를 만드는 것**이 목적이다 — ACK 를 일부러 생략해
// 서버를 half-open 으로 남기거나, ACK 대신 RST 로 끊는다.
//
// src IP 는 하나여야 한다. 상대가 응답의 L2 목적지를 ARP 로 정하는데, 우리는
// 커널 스택이 없어 ARP 에 답하지 않으므로, 상대 쪽에 우리 포트 MAC 으로 향하는
// 정적 ARP(또는 라우팅)가 있어야 응답이 돌아온다. → docs/DEPLOYMENT.md
// ─────────────────────────────────────────────────────────────
message HandshakeSpec {
  EthSpec eth      = 1;
  string  src_ip   = 2;  // 우리 식별자 (상대가 여기로 응답)
  string  dst_ip   = 3;
  uint32  dst_port = 4;

  // 동시에 시도할 세션 수. 세션마다 다른 src port 를 쓴다(base 부터 순차).
  uint32 sessions      = 5;
  uint32 src_port_base = 6;  // 0 = 40000

  enum Action {
    ACTION_UNSPECIFIED = 0;  // = COMPLETE (기본값)
    ACTION_COMPLETE    = 1;  // ACK 전송 → 정상 3-way
    ACTION_HALF_OPEN   = 2;  // ACK 생략 → 서버를 half-open 으로 남긴다
    ACTION_RST         = 3;  // ACK 대신 RST → 급작 종료
  }
  Action on_synack = 7;

  // SYN 을 보내고 이 시간 안에 SYN-ACK 가 없으면 timeout 으로 판정한다. 0 = 1000ms.
  uint32 synack_timeout_ms = 8;
}

message StopScenarioRequest {
  string scenario_id = 1;
}

message Ack {
  bool   ok      = 1;
  string message = 2;
}

// ─────────────────────────────────────────────────────────────
// 텔레메트리 — 100ms 주기 push.
//
// 개별 패킷(mbuf)은 절대 이 채널을 넘지 않는다. 148 Mpps 를 프로세스 경계
// 밖으로 내보내는 건 성립하지 않는다. worker lcore 가 per-lcore 카운터에
// 누적한 것을 제어 스레드가 합산해 스냅샷으로만 올린다.
// ─────────────────────────────────────────────────────────────
message PortStats {
  uint32 port_id  = 1;
  uint64 tx_pkts  = 2;
  uint64 tx_bytes = 3;
  uint64 tx_drop  = 4;
  uint64 tx_err   = 5;
  uint64 rx_pkts  = 6;
  uint64 rx_bytes = 7;
  uint64 rx_drop  = 8;
  uint64 rx_err   = 9;
}

message TelemetrySnapshot {
  uint64 ts_ns   = 1;  // 데이터플레인 기준 시각
  string node_id = 2;

  repeated PortStats ports = 3;

  // 이벤트 ring 이 가득 차 버려진 개수.
  // 이 값이 늘면 제어부가 이벤트를 충분히 빨리 소비하지 못하고 있다는 뜻이다.
  uint64 event_drop = 4;

  uint32 active_lcores = 5;

  // 진행 중인 시나리오. 비어 있으면 유휴다.
  //
  // 포트 카운터만으로는 "누가 시켜서 나가는 트래픽인지" 알 수 없다. 제어부가
  // 명령한 것과 실제로 도는 것을 대조하려면 데이터플레인이 스스로 무엇을 하고
  // 있다고 생각하는지를 올려야 한다.
  string active_scenario = 6;
  uint32 tx_lcores       = 7;  // 그 시나리오가 실제로 쓰는 worker 수

  // worker 가 tx_burst 에 넣지 못해 버린 패킷 누계.
  // 이 값이 늘면 NIC 이 요구 속도를 못 따라가고 있다는 뜻이다.
  uint64 tx_drop = 8;

  // 수신 분류 (RX lcore 가 프레임을 파싱해 집계).
  //
  // **개별 응답 패킷은 경계를 넘지 않는다.** SYN 홍수에 상대가 초당 수백만
  // SYN-ACK 를 돌려줘도 그걸 하나씩 올리는 건 성립하지 않는다. 그래서 판정은
  // 여기 카운터로 집계하고, 이벤트(Event)는 이상동작만 표본으로 올린다.
  RxClass rx = 9;

  // handshake 제어 집계 (모드 B). 유휴면 비어 있다.
  HandshakeStats handshake = 10;
}

// handshake 세션의 진행 집계. RTT 는 µs 단위.
message HandshakeStats {
  uint32 sessions   = 1;  // 총 세션 수
  uint32 sent       = 2;  // SYN 을 보낸 수
  uint32 synack     = 3;  // SYN-ACK 를 받은 수
  uint32 completed  = 4;  // 지정 행동까지 끝낸 수
  uint32 refused    = 5;  // SYN 에 RST 로 거부된 수
  uint32 timed_out  = 6;  // SYN-ACK 무응답

  uint32 rtt_min_us = 7;
  uint32 rtt_avg_us = 8;
  uint32 rtt_max_us = 9;
}

// TCP 플래그별 수신 분류. handshake 검증의 1차 지표다.
//
//   포트 열림  → SYN 홍수에 syn_ack 가 오른다
//   포트 닫힘  → rst 가 오른다
//   무응답     → 둘 다 그대로 (SYN-ACK timeout 판정은 흐름 상태가 필요한 Phase 4)
message RxClass {
  uint64 tcp_syn     = 1;  // SYN only (우리 쪽으로 걸어오는 연결 시도)
  uint64 tcp_syn_ack = 2;  // SYN+ACK (우리 SYN 에 대한 응답 — 포트 열림)
  uint64 tcp_rst     = 3;  // RST (포트 닫힘 / 거부)
  uint64 tcp_fin     = 4;  // FIN 포함
  uint64 tcp_ack     = 5;  // ACK only (데이터/핸드셰이크 3단계)
  uint64 tcp_other   = 6;  // 위 어디에도 안 맞는 플래그 조합
  uint64 udp         = 7;
  uint64 non_ip      = 8;  // ARP 등 비 IPv4
}

// ─────────────────────────────────────────────────────────────
// 판정 이벤트 — C 가 µs 단위로 내린 실시간 판정 결과의 요약.
// 세션 단위 집계·룰 판정은 제어부가 이 이벤트들을 모아 수행한다.
// ─────────────────────────────────────────────────────────────
message Event {
  enum Kind {
    KIND_UNSPECIFIED       = 0;
    KIND_SYNACK_TIMEOUT    = 1;  // SYN 보냈으나 SYN-ACK 없음 (Phase 4)
    KIND_RST_RECEIVED      = 2;  // 포트 닫힘 추정
    KIND_UNEXPECTED_FLAG   = 3;
    KIND_RETRANSMIT        = 4;
    KIND_HANDSHAKE_DONE    = 5;  // 3-way 완료 (rtt_us 에 왕복시간)
    KIND_HANDSHAKE_REFUSED = 6;  // SYN 에 RST 로 거부됨
  }

  uint64 ts_ns    = 1;
  Kind   kind     = 2;
  uint32 port_id  = 3;
  string flow_key = 4;  // "src:sport>dst:dport/proto"
  uint32 rtt_us   = 5;
  string detail   = 6;
}

// ─────────────────────────────────────────────────────────────
// hop ④ — 사이드카가 서버, 제어부가 클라이언트.
//
// 제어부는 함대 설정(fleet.yaml)에 적힌 주소 집합에 자동으로 연결/해제한다.
// 장비 경계를 넘으므로 이 hop 은 mTLS 로 보호된다 — control/internal/mtls.
// ─────────────────────────────────────────────────────────────
service DataPlane {
  rpc Hello(HelloRequest) returns (HelloResponse);

  rpc StartScenario(StartScenarioRequest) returns (Ack);
  rpc StopScenario(StopScenarioRequest) returns (Ack);

  rpc StreamTelemetry(StreamTelemetryRequest) returns (stream TelemetrySnapshot);
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
}

message StreamTelemetryRequest {}
message StreamEventsRequest {}
